services:
  redis:
    image: redis:7-alpine
    container_name: wtc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./wall-texture-crm-api
      dockerfile: Dockerfile
    container_name: wtc-backend
    restart: unless-stopped
    env_file:
      - ./wall-texture-crm-api/.env.docker
    ports:
      - "3001:3001"
    volumes:
      - backend-uploads:/app/uploads
      - backend-whatsapp-sessions:/app/whatsapp-sessions
      - backend-backups:/app/backups
    # Lets the container resolve host.docker.internal on Linux hosts too
    # (Docker Desktop on Windows/Mac provides this automatically).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  frontend:
    build:
      context: ./wall-texture-crm
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: wtc-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis-data:
  backend-uploads:
  backend-whatsapp-sessions:
  backend-backups:
